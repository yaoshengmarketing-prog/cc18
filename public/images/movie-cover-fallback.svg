<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 538" role="img" aria-labelledby="title description">
  <title id="title">CC18 作品封面暫時無法載入</title>
  <desc id="description">黑白與桃紅色的通用作品封面替代圖</desc>
  <rect width="800" height="538" fill="#17181b"/>
  <path d="M0 420 800 180v358H0z" fill="#222328"/>
  <rect x="0" y="0" width="18" height="538" fill="#ff4d98"/>
  <circle cx="646" cy="106" r="170" fill="none" stroke="#ff4d98" stroke-opacity=".25" stroke-width="2"/>
  <circle cx="646" cy="106" r="118" fill="none" stroke="#fff" stroke-opacity=".11" stroke-width="2"/>
  <text x="58" y="80" fill="#ff78ae" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="4">CC18 / MOVIE MASTER</text>
  <text x="58" y="389" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="700">作品封面載入中斷</text>
  <text x="60" y="430" fill="#aaaab1" font-family="Arial, sans-serif" font-size="18">仍可開啟站內影評與作品資料</text>
