name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run registry:validate
      - run: npm run content:validate
      - run: npm run source:test
      - run: npm run media:test
      - run: npm run bridge:test
      - run: npm run worker:test
      - run: npm run discovery:test
      - run: npm run d1:test
      - run: npm run editorial:provider:test
      - run: npm run editorial:safety:test
      - run: npm run editorial:normalization:test
      - run: npm run editorial:search:test
      - run: npm run build
