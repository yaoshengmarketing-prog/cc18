name: Content pipeline (manual dry run)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Pipeline stage
        required: true
        default: plan
        type: choice
        options: [plan, discover, produce, publish, retry-media]
      queue_store:
        description: Discovery queue backend (file is an ephemeral dry run; d1 is persistent)
        required: true
        default: file
        type: choice
        options: [file, d1]

permissions:
  contents: read

concurrency:
  group: cc18-content-pipeline
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run registry:validate
      - run: npm run content:validate
      - name: Run discovery and queue eligible works
        if: inputs.stage == 'discover'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run discovery:run -- --store=${{ inputs.queue_store }}
      - name: Run foundation stage
        if: inputs.stage != 'discover'
        run: node scripts/pipeline.mjs "${{ inputs.stage }}"
      - name: Guard production activation
        run: echo "Daily schedule and automatic production remain intentionally disabled; discovery is manual only."
