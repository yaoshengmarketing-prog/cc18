name: Content pipeline

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      stage:
        description: Pipeline stage
        required: true
        default: plan
        type: choice
        options: [plan, editorial-smoke, discover, end-to-end, produce, publish, retry-media]
      queue_store:
        description: Discovery queue backend (file is an ephemeral dry run; d1 is persistent)
        required: true
        default: file
        type: choice
        options: [file, d1]
      movie_id:
        description: Exact movie ID required for publish, for example SDAB-358
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: cc18-content-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run registry:validate
      - run: npm run content:validate
      - name: Configure publisher identity
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.stage == 'publish' || inputs.stage == 'end-to-end'))
        run: |
          git config user.name "cc18-publisher[bot]"
          git config user.email "cc18-publisher[bot]@users.noreply.github.com"
      - name: Discover all eligible works and drain the D1 queue
        if: github.event_name == 'schedule'
        env:
          AITOKENKING_API_KEY: ${{ secrets.AITOKENKING_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CC18_R2_AUTH_MODE: api-token
          CC18_ALLOW_EDITORIAL_TRANSMISSION: YES
          CC18_ALLOW_IMAGE_TRANSMISSION: YES
        shell: bash
        run: |
          set +e
          npm run discovery:run -- --store=d1
          discovery_exit=$?
          set -e
          npm run canary:drain -- --time-budget-minutes=240
          exit "$discovery_exit"
      - name: Verify editorial provider connectivity only
        if: github.event_name == 'workflow_dispatch' && inputs.stage == 'editorial-smoke'
        env:
          AITOKENKING_API_KEY: ${{ secrets.AITOKENKING_API_KEY }}
        run: npm run editorial:provider:smoke
      - name: Run discovery and queue eligible works
        if: github.event_name == 'workflow_dispatch' && inputs.stage == 'discover'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run discovery:run -- --store=${{ inputs.queue_store }}
      - name: Run foundation stage
        if: github.event_name == 'workflow_dispatch' && inputs.stage != 'discover' && inputs.stage != 'publish' && inputs.stage != 'editorial-smoke' && inputs.stage != 'end-to-end'
        run: node scripts/pipeline.mjs "${{ inputs.stage }}"
      - name: Require an exact movie ID for publishing
        if: github.event_name == 'workflow_dispatch' && (inputs.stage == 'publish' || inputs.stage == 'end-to-end')
        shell: bash
        env:
          MOVIE_ID: ${{ inputs.movie_id }}
        run: |
          if [[ ! "$MOVIE_ID" =~ ^[A-Za-z0-9]+(-[A-Za-z0-9]+)+$ ]]; then
            echo "movie_id must be an exact ID such as SNOS-409" >&2
            exit 1
          fi
          echo "MOVIE_ID=${MOVIE_ID^^}" >> "$GITHUB_ENV"
      - name: Run one end-to-end D1 canary
        if: github.event_name == 'workflow_dispatch' && inputs.stage == 'end-to-end'
        env:
          AITOKENKING_API_KEY: ${{ secrets.AITOKENKING_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CC18_R2_AUTH_MODE: api-token
          CC18_ALLOW_EDITORIAL_TRANSMISSION: YES
          CC18_ALLOW_IMAGE_TRANSMISSION: YES
        run: npm run canary:run -- --max=1 --ids="$MOVIE_ID"
      - name: Validate, deploy and complete the D1 publish job
        if: github.event_name == 'workflow_dispatch' && inputs.stage == 'publish'
        env:
          MOVIE_ID: ${{ inputs.movie_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run publish:d1:process-one -- "$MOVIE_ID"
      - name: Confirm serialized production automation
        if: github.event_name == 'schedule'
        run: echo "Hourly discovery and serial single-work queue draining are enabled."
      - name: Preserve editorial responses for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-responses-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cc18-editorial-responses/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
