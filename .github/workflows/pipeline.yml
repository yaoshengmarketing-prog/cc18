name: Content pipeline (manual canary)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Pipeline stage
        required: true
        default: plan
        type: choice
        options: [plan, discover, produce, publish, retry-media]
      queue_store:
        description: Discovery queue backend (file is an ephemeral dry run; d1 is persistent)
        required: true
        default: file
        type: choice
        options: [file, d1]
      movie_id:
        description: Exact movie ID required for publish, for example SDAB-358
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: cc18-content-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run registry:validate
      - run: npm run content:validate
      - name: Run discovery and queue eligible works
        if: inputs.stage == 'discover'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run discovery:run -- --store=${{ inputs.queue_store }}
      - name: Run foundation stage
        if: inputs.stage != 'discover' && inputs.stage != 'publish'
        run: node scripts/pipeline.mjs "${{ inputs.stage }}"
      - name: Require an exact movie ID for publishing
        if: inputs.stage == 'publish'
        shell: bash
        env:
          MOVIE_ID: ${{ inputs.movie_id }}
        run: test -n "$MOVIE_ID"
      - name: Configure publisher identity
        if: inputs.stage == 'publish'
        run: |
          git config user.name "cc18-publisher[bot]"
          git config user.email "cc18-publisher[bot]@users.noreply.github.com"
      - name: Validate, deploy and complete the D1 publish job
        if: inputs.stage == 'publish'
        env:
          MOVIE_ID: ${{ inputs.movie_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run publish:d1:process-one -- "$MOVIE_ID"
      - name: Guard production activation
        run: echo "Daily schedule and automatic production remain intentionally disabled; discovery is manual only."
